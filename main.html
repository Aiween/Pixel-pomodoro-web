<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Space Pomodoro</title>
        <link rel="icon" href="space-travel.png">

        <!-- Retro Pixel Font from Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">


        <!--style sheet -->
        <link rel="stylesheet" href="styles.css">
    
    </head>

    <body>
        
        <!-- Background decorative night sky elements -->
        <div class="sky-background" aria-hidden="true">
            <div class="pixel-stars"></div>
        </div>

         <main class="space-hud">
        
            <!--Header-->
            <header class="hud-header">
                <span class="saucer-icon">🛸</span>
                <span class="ship-status">ORBITING EARTH</span>
                <button type="button" id="music-toggle-btn" class=" pixel-btn sound-toggle" aria-label="Toggle background music">🎵 OFF</button>
            </header>
            

            <!--  Mode selector buttons -->
            <nav class="mode-selector" aria-label="Timer modes">
                <button type="button" class="pixel-btn mode-btn active" id="mode-pomodoro">Focus</button>
                <button type="button" class="pixel-btn mode-btn" id="mode-short">Short Rest</button>
                <button type="button" class="pixel-btn mode-btn" id="mode-long">Long Rest</button>
            </nav>

            <!-- Display area (the beam / window) -->
            <section class="timer-display" aria-live="polite">
                <h1 id="time-left">25:00</h1>
                <p id="current-mode-label">✦ beams active ✦</p>
            </section>

            <!-- Timer action buttons -->
            <div class="timer-controls">
                <button type="button" class="pixel-btn action-btn primary" id="start-pause-btn">START</button>
                <button type="button" class="pixel-btn action-btn secondary" id="reset-btn">RESET</button>
            </div>

            <!--  Session stats / cute counters -->
            <footer class="session-tracker">
                <span>Completed beams:</span>
                <span id="pomodoro-count" class="count-pill">0</span>
            </footer>


  </main>
  <audio id="bg-audio" loop src="space.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
